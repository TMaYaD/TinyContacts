name: Publish APK to GitHub Packages

# Builds the app's APK and publishes it to the GitHub Packages Maven registry
# (maven.pkg.github.com) every time a pull request is merged into main.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish-apk:
    # `pull_request: closed` also fires on PRs closed *without* merging — gate on merged.
    # workflow_dispatch always runs so the pipeline can be exercised on demand.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted ubuntu runners ship the Android SDK (ANDROID_HOME preset) and can reach
      # dl.google.com, so assembleDebug resolves AGP/AndroidX and builds with no extra setup.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and publish APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Unique, monotonic version per run — GitHub Packages rejects re-publishing a version.
        run: ./gradlew :app:publish -PappVersion=1.0.${{ github.run_number }} --no-daemon --stacktrace
