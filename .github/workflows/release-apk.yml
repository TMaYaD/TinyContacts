name: Release APK

# Builds the app's APK and publishes it as a GitHub Release asset every time a
# pull request is merged into main (and on manual dispatch).
#
# Versioning follows the semver strategy from TMaYaD/Jeeves (cd-app.yml): the
# version is derived from git tags + conventional commits — a GA tag (vX.Y.Z) is
# emitted verbatim, otherwise a <target>-<stage>.<N> pre-release is computed,
# where <target> is bumped from the last stable tag by conventional commits
# (feat! / BREAKING CHANGE -> major, feat -> minor, else patch) and <stage> is
# the most recent beta/rc stage tag in HEAD's ancestry (alpha if none).
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # create releases + push auto-retag tags

jobs:
  version:
    name: Compute Version
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      is_release: ${{ steps.compute.outputs.is_release }}
      is_prerelease: ${{ steps.compute.outputs.is_prerelease }}
      target: ${{ steps.compute.outputs.target }}
      stage: ${{ steps.compute.outputs.stage }}
      target_changed: ${{ steps.compute.outputs.target_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Compute version
        id: compute
        run: |
          set -euo pipefail

          GA_PAT='^v[0-9]+\.[0-9]+\.[0-9]+$'
          STAGE_PAT='^v[0-9]+\.[0-9]+\.[0-9]+-(beta|rc)$'

          # --- Versioning model (ported from TMaYaD/Jeeves) -----------------
          # Stage tags (vX.Y.Z-beta, vX.Y.Z-rc) and the GA tag (vX.Y.Z) are
          # stage-transition markers. Artifact versions are computed as
          #   <target>-<stage>.<N>          e.g. 1.3.0-alpha.4
          # where <stage> is the most recent stage tag's suffix in HEAD's
          # ancestry (alpha if none), and N resets at each stage boundary:
          #   alpha:   commits since LAST_STABLE
          #   beta/rc: commits since the stage tag, +1 (tagged commit is .1)
          # Conventional-commit bumps since LAST_STABLE may push <target>
          # above what the stage tag declared; if so, auto-retag at HEAD.
          # versionCode is github.run_number (globally monotonic).
          # ------------------------------------------------------------------

          HEAD_TAGS=$(git tag --points-at HEAD)
          HEAD_GA=$(echo "$HEAD_TAGS" | grep -E "$GA_PAT" | sort -V | tail -1 || true)
          HEAD_STAGE_TAG=$(echo "$HEAD_TAGS" | grep -E "$STAGE_PAT" | sort -V | tail -1 || true)

          # GA build: HEAD is at a vX.Y.Z tag — emit it verbatim, done.
          if [ -n "$HEAD_GA" ]; then
            VERSION="${HEAD_GA#v}"
            {
              echo "version=${VERSION}"
              echo "is_release=true"
              echo "is_prerelease=false"
              echo "target=${VERSION}"
              echo "stage="
              echo "target_changed=false"
            } >> "$GITHUB_OUTPUT"
            echo "Computed: ${VERSION} (GA)"
            exit 0
          fi

          LAST_STABLE=$(git tag --list 'v*' | grep -E "$GA_PAT" | sort -V | tail -1 || true)

          # Compute target version from conventional commits since LAST_STABLE.
          if [ -z "$LAST_STABLE" ]; then
            BASE="0.0.0"
            LOG_RANGE="HEAD"
          else
            BASE="${LAST_STABLE#v}"
            LOG_RANGE="${LAST_STABLE}..HEAD"
          fi

          BUMP="patch"
          # NUL-delimit per commit (-z) so each $msg holds one full message.
          # Subject-anchored regexes must only see the subject line, else a
          # revert/quoted body line starting with `feat:`/`fix!:` would falsely
          # trigger a bump. BREAKING CHANGE is a footer, so scan the whole body.
          while IFS= read -r -d '' msg; do
            [ -z "$msg" ] && continue
            subject="${msg%%$'\n'*}"
            if printf '%s' "$subject" | grep -qE '^[a-z]+(\(.+\))?!:' \
               || printf '%s' "$msg" | grep -q 'BREAKING CHANGE'; then
              BUMP="major"; break
            elif printf '%s' "$subject" | grep -qE '^feat(\(.+\))?:'; then
              [ "$BUMP" != "major" ] && BUMP="minor"
            fi
          done < <(git log -z "$LOG_RANGE" --format="%B" 2>/dev/null || true)

          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          PATCH=$(echo "$BASE" | cut -d. -f3)
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          COMPUTED_TARGET="${MAJOR}.${MINOR}.${PATCH}"

          # Most recent stage tag in HEAD's ancestry (rc beats beta by recency).
          STAGE_TAG=$(git describe --tags --abbrev=0 \
                        --match 'v[0-9]*.[0-9]*.[0-9]*-beta' \
                        --match 'v[0-9]*.[0-9]*.[0-9]*-rc' \
                        HEAD 2>/dev/null || true)

          # Discard stage tags from an already-GA'd cycle: after vX.Y.0 ships,
          # its -rc/-beta remain in ancestry but the next cycle starts as alpha.
          if [ -n "$STAGE_TAG" ] && [ -n "$LAST_STABLE" ] \
             && git merge-base --is-ancestor "$STAGE_TAG" "$LAST_STABLE"; then
            STAGE_TAG=""
          fi

          TARGET_CHANGED="false"
          if [ -n "$STAGE_TAG" ]; then
            STAGE="${STAGE_TAG##*-}"                        # beta | rc
            TAG_TARGET="${STAGE_TAG#v}"; TAG_TARGET="${TAG_TARGET%-*}"

            HIGHER=$(printf '%s\n%s\n' "$TAG_TARGET" "$COMPUTED_TARGET" | sort -V | tail -1)
            if [ "$HIGHER" = "$COMPUTED_TARGET" ] && [ "$TAG_TARGET" != "$COMPUTED_TARGET" ]; then
              TARGET="$COMPUTED_TARGET"
              TARGET_CHANGED="true"
              N=1   # anticipate the auto-retag: this build matches future runs
            else
              TARGET="$TAG_TARGET"
              DIST=$(git rev-list --count "${STAGE_TAG}..HEAD")
              N=$((DIST + 1))
            fi
          else
            STAGE="alpha"
            TARGET="$COMPUTED_TARGET"
            if [ -z "$LAST_STABLE" ]; then
              N=$(git rev-list --count HEAD)
            else
              N=$(git rev-list --count "${LAST_STABLE}..HEAD")
            fi
          fi

          VERSION="${TARGET}-${STAGE}.${N}"

          # is_release: HEAD carries a stage tag that matches this build's
          # computed target/stage (the tag genuinely names this artifact).
          EXPECTED_STAGE_TAG="v${TARGET}-${STAGE}"
          if [ -n "$HEAD_STAGE_TAG" ] && [ "$HEAD_STAGE_TAG" = "$EXPECTED_STAGE_TAG" ]; then
            IS_RELEASE="true"
          else
            IS_RELEASE="false"
          fi

          {
            echo "version=${VERSION}"
            echo "is_release=${IS_RELEASE}"
            echo "is_prerelease=true"
            echo "target=${TARGET}"
            echo "stage=${STAGE}"
            echo "target_changed=${TARGET_CHANGED}"
          } >> "$GITHUB_OUTPUT"
          echo "Computed: ${VERSION} (stage=${STAGE}, target_changed=${TARGET_CHANGED}, release=${IS_RELEASE})"

      - name: Auto-retag when conventional commits bump target past stage tag
        if: steps.compute.outputs.target_changed == 'true'
        env:
          NEW_TARGET: ${{ steps.compute.outputs.target }}
          STAGE: ${{ steps.compute.outputs.stage }}
        run: |
          set -euo pipefail
          NEW_TAG="v${NEW_TARGET}-${STAGE}"
          if git rev-parse "refs/tags/${NEW_TAG}" >/dev/null 2>&1; then
            echo "Tag ${NEW_TAG} already exists; nothing to do."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$NEW_TAG" -m "Auto-retag: conventional commits bumped target to ${NEW_TARGET}" HEAD
          if git push origin "$NEW_TAG"; then
            echo "Pushed ${NEW_TAG} at $(git rev-parse --short HEAD)"
          else
            git fetch --tags origin
            if git rev-parse "refs/tags/${NEW_TAG}" >/dev/null 2>&1; then
              echo "Tag ${NEW_TAG} was created by a concurrent run; nothing to do."
            else
              echo "::error::Failed to push ${NEW_TAG} and it does not exist on remote"
              exit 1
            fi
          fi

  release:
    name: Build & Release APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK and reaches dl.google.com, so
      # assembleDebug resolves AGP/AndroidX and builds with no extra setup.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        # Debug APK: signed with the debug keystore, so CI needs no signing
        # secrets. Point at outputs/apk/release + a signingConfig for a signed
        # release build. versionCode = run_number (globally monotonic).
        run: |
          ./gradlew :app:assembleDebug \
            -PappVersion="${APP_VERSION}" \
            -PversionCode="${{ github.run_number }}" \
            --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/TempContacts-${APP_VERSION}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          IS_PRERELEASE: ${{ needs.version.outputs.is_prerelease }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          ASSET="dist/TempContacts-${VERSION}.apk"
          PRERELEASE_FLAG=""
          [ "${IS_PRERELEASE}" = "true" ] && PRERELEASE_FLAG="--prerelease"

          NOTES="Automated APK build for ${TAG}."
          if [ -n "${{ github.event.pull_request.number || '' }}" ]; then
            NOTES="${NOTES}"$'\n'"From PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          fi

          # Idempotent: update the asset if a release for this tag already
          # exists (e.g. a re-run), otherwise create the release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "$TAG" \
              --target "$TARGET_SHA" \
              --notes "$NOTES" \
              $PRERELEASE_FLAG
          fi
          echo "Released $TAG (prerelease=${IS_PRERELEASE})"
